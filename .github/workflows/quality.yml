name: Quality and security

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      DATABASE_URL: file:./ci.db
      APP_ORIGIN: http://localhost:3000
      AUDIT_HASH_SECRET: ci-only-audit-hash-secret-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate and validate Prisma client
        run: |
          npx prisma generate
          npx prisma validate

      - name: Run full quality and security gate
        run: npm run check

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: "postgresql://crm:crm_ci_password@localhost:5432/crm_test?schema=public&connection_limit=20&pool_timeout=30"
      POSTGRES_TEST_DATABASE: "1"
      AUDIT_HASH_SECRET: ci-only-audit-hash-secret-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated PostgreSQL schema
        run: npm run db:pg:check

      - name: Migrate PostgreSQL from zero
        run: |
          npx prisma generate --schema prisma/postgresql/schema.prisma
          npm run db:pg:migrate
          npx prisma migrate status --schema prisma/postgresql/schema.prisma
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/postgresql/schema.prisma --exit-code

      - name: Verify PostgreSQL runtime and concurrency
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm run test:postgres

      - name: Seed smoke (guarded, transactional)
        env:
          DEMO_SEED_PASSWORD: Ci-Seed-Smoke-Password!2026
          DEMO_SEED_CONFIRM: "1"
        run: |
          npm run db:seed
          node -e "const {PrismaClient}=require('@prisma/client');const p=new PrismaClient();p.user.count().then(c=>{console.log('seeded users:',c);if(c<13){console.error('seed transaction did not seed expected personnel');process.exit(1)}}).finally(()=>p.\$disconnect())"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRM_IMAGE_TAG: ci
      CRM_PORT: "3100"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create ephemeral deployment secrets
        run: |
          mkdir -p deploy/secrets
          printf '%s' 'crm-container-ci-password' > deploy/secrets/postgres_password
          printf '%s' 'postgresql://crm:crm-container-ci-password@database:5432/crm?schema=public&connection_limit=20&pool_timeout=30' > deploy/secrets/database_url
          printf '%s' 'http://127.0.0.1:3100' > deploy/secrets/app_origin
          printf '%s' 'container-ci-only-audit-secret-at-least-32-characters' > deploy/secrets/audit_hash_secret

      - name: Build immutable targets and start clean deployment
        run: docker compose -p crm-ci -f compose.production.yml up --detach --build --wait

      - name: Verify deployed behavior
        env:
          BASE_URL: http://127.0.0.1:3100
        run: npm run test:container-smoke

      - name: Verify runtime hardening
        run: |
          app_id=$(docker compose -p crm-ci -f compose.production.yml ps -q app)
          test "$(docker inspect "$app_id" --format '{{.Config.User}}')" = 'nextjs'
          test "$(docker inspect "$app_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = 'true'
          test "$(docker inspect "$app_id" --format '{{.State.Health.Status}}')" = 'healthy'

      - name: Preserve deployment logs on failure
        if: failure()
        run: docker compose -p crm-ci -f compose.production.yml logs --no-color

      - name: Remove ephemeral deployment
        if: always()
        run: docker compose -p crm-ci -f compose.production.yml down --volumes --remove-orphans

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate SQLite Prisma client
        env:
          DATABASE_URL: file:./e2e.db
        run: npx prisma generate

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Preserve browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .runtime/playwright-report
            .runtime/playwright-results
          if-no-files-found: ignore
          retention-days: 7
